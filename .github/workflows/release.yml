name: Release

on:
  push:
    tags: 'v*'

jobs:
  build:
    name: Create release
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true

      - name: Install Node.js dependencies
        run: yarn

      - name: Build binary for mac
        run: yarn electron:build:mac -- --publish=never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build binary for win
        run: yarn electron:build:win -- --publish=never

      - name: Build binary for linux
        run: yarn electron:build:linux -- --publish=never

      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset (intel mac)
        id: upload-release-asset_mac_intel
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/MarkuPrev-${{ github.ref_name }}-mac-x64.dmg
          asset_name: MarkuPrev-${{ github.ref_name }}-mac-x64.dmg
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (apple silicon mac)
        id: upload-release-asset_mac_apple_silicon
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/MarkuPrev-${{ github.ref_name }}-mac-arm64.dmg
          asset_name: MarkuPrev-${{ github.ref_name }}-mac-arm64.dmg
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (win)
        id: upload-release-asset_win
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/MarkuPrev-${{ github.ref_name }}-win-setup.exe
          asset_name: MarkuPrev-${{ github.ref_name }}-win-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (linux)
        id: upload-release-asset_linux
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/MarkuPrev-${{ github.ref_name }}-linux.AppImage
          asset_name: MarkuPrev-${{ github.ref_name }}-linux.AppImage
          asset_content_type: application/octet-stream
